{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="hero container grid grid-2">
    <div>
        <h1>Naam accommodatie</h1>
        <p>
            Rustige B&B in het groen, ideaal voor een ontspannen verblijf.
            Geniet van comfort, natuur en privacy.
        </p>

        <a href="/boeken/" class="btn btn-secondary">Boeken</a>
    </div>

    <div>
        <img src="{% static 'images/front.jpg' %}" alt="Accommodatie">
    </div>
</section>

<section class="container grid grid-2" style="margin-top: 3rem;">
    <div>
        <img src="{% static 'images/kitchen.jpg' %}" alt="Keuken">
    </div>
    <div>
        <h2>Extra info</h2>
        <p>
            Volledig uitgeruste keuken, privé tuin en moderne badkamer.
        </p>
    </div>
</section>
{% endblock %}
